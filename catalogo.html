<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
</head>
<body>
    <h1>Catálogo de Veículos</h1>
      <section class="pagina veiculos" id="veiculos">

            <div class="titulo-pagina">
                <p class="subtitulo">NOSSA LINHA</p>
                <h2>Escolha sua próxima experiência.</h2>
                <p>Conheça os modelos exclusivos ATRION.</p>
            </div>

            <div class="grade-carros">

                <article class="card-carro" data-modelo="a1">
                    <button class="abrir-carro">
                        <img src="assets/atrion-sedan.png" alt="ATRION A1">

                        <span class="categoria">ELÉTRICO • LUXO</span>

                        <h3>ATRION A1</h3>
                        <p>Sedã elétrico</p>

                        <strong>A partir de R$ 289.900*</strong>
                        <span class="seta">↗️</span>
                    </button>
                </article>

                <article class="card-carro" data-modelo="s9">
                    <button class="abrir-carro">
                        <img src="assets/atrion-esportivo.png" alt="ATRION S9">

                        <span class="categoria">PERFORMANCE • ESPORTIVO</span>

                        <h3>ATRION S9</h3>
                        <p>Cupê esportivo</p>

                        <strong>A partir de R$ 419.900*</strong>
                        <span class="seta">↗️</span>
                    </button>
                </article>

                <article class="card-carro conceito">
                    <div class="conceito-imagem">
                        <span>ATRION</span>
                        <h3>COMING NEXT</h3>
                    </div>

                    <h3>ATRION X</h3>
                    <p>O próximo capítulo</p>
                    <strong>Em breve</strong>
                </article>

            </div>

            <p class="aviso">
                *Preços ilustrativos para demonstração do projeto.
            </p>

            <div class="grade-carros">

                <article class="card-carro" data-modelo="a1">
                    <button class="abrir-carro">
                        <img src="assets/atrion-sedan.png" alt="ATRION A1">

                        <span class="categoria">ELÉTRICO • LUXO</span>

                        <h3>ATRION A1</h3>
                        <p>Sedã elétrico</p>

                        <strong>A partir de R$ 289.900*</strong>
                        <span class="seta">↗️</span>
                    </button>
                </article>
            <div class="grade-carros">

<article class="card-carro" data-modelo="a1">
          <button class="abrir-carro">
            <img src="assets/atrion-sedan.png" alt="ATRION A1">

            <span class="categoria">ELÉTRICO • LUXO</span>

            <h3>ATRION A1</h3>
            <p>Sedã elétrico</p>

            <strong>A partir de R$ 289.900*</strong>
            <span class="seta">↗️</span>
          </button>
        </article>

        </section>

</body>
